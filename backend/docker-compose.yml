version: '3.8'

services:
  backend:
    build: .
    ports:
      - "3001:3001"
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src
      # Mount database directory to persist data
      - ./database:/app/database
    environment:
      - NODE_ENV=development
      - PORT=3001
    restart: unless-stopped
