<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Success API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 { color: #14b8a6; }
        .kpi-card {
            background: #2a2a2a;
            border: 2px solid #14b8a6;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
        }
        .kpi-name { font-size: 14px; color: #888; }
        .kpi-value { font-size: 32px; font-weight: bold; color: #fff; }
        .kpi-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-excellent, .status-good { background: #10b981; color: #fff; }
        .status-warning { background: #f59e0b; color: #fff; }
        .status-critical { background: #ef4444; color: #fff; }
        .error { background: #7f1d1d; padding: 20px; border-radius: 8px; }
        .loading { text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <h1>🎯 Customer Success & Experience Analytics - API Test</h1>
    <div id="content">
        <div class="loading">Loading Customer Success data...</div>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('http://localhost:3001/api/customer-success/kpis/current');
                const data = await response.json();

                if (!data.success) {
                    throw new Error('API returned error');
                }

                const html = `
                    <h2>Period: ${data.period.label} (${data.period.startDate} to ${data.period.endDate})</h2>
                    ${Object.entries(data.kpis).map(([key, kpi]) => `
                        <div class="kpi-card">
                            <div class="kpi-name">${kpi.name}</div>
                            <div class="kpi-value">${typeof kpi.value === 'number' ? kpi.value.toFixed(1) : kpi.value}${kpi.unit}</div>
                            <span class="kpi-status status-${kpi.status.toLowerCase()}">${kpi.status}</span>
                            <div style="margin-top: 10px; font-size: 12px; color: #888;">
                                Benchmark: ${kpi.benchmark}${kpi.unit}
                            </div>
                            <div style="margin-top: 10px; font-size: 12px; color: #aaa; font-family: monospace;">
                                ${kpi.formula}
                            </div>
                        </div>
                    `).join('')}
                `;

                document.getElementById('content').innerHTML = html;
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <h2>❌ Error Loading Data</h2>
                        <p>${error.message}</p>
                        <p>Make sure the backend server is running on http://localhost:3001</p>
                    </div>
                `;
            }
        }

        loadData();
    </script>
</body>
</html>
