<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="120" viewBox="0 0 400 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (optional - remove for transparent) -->
  <rect width="400" height="120" fill="#111827" rx="8"/>

  <!-- Definitions -->
  <defs>
    <linearGradient id="elevareGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Logo Icon -->
  <g transform="translate(30, 30)">
    <!-- Outer ring -->
    <circle cx="30" cy="30" r="27" stroke="url(#elevareGradient)" stroke-width="2.5" opacity="0.3" fill="none"/>

    <!-- Inner design - stylized E with upward arrow -->
    <path
      d="M20 17 L40 17 M20 17 L20 43 M20 30 L36 30 M20 43 L40 43"
      stroke="url(#elevareGradient)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Upward trend arrow -->
    <path
      d="M36 35 L45 24 M45 24 L40 24 M45 24 L45 29"
      stroke="url(#elevareGradient)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Accent dots -->
    <circle cx="30" cy="10" r="2" fill="#06b6d4" opacity="0.6"/>
    <circle cx="10" cy="30" r="2" fill="#3b82f6" opacity="0.6"/>
    <circle cx="50" cy="30" r="2" fill="#06b6d4" opacity="0.6"/>
  </g>

  <!-- Text -->
  <g transform="translate(110, 60)">
    <!-- Elevare text -->
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#ffffff">
      Elevare
    </text>

    <!-- IQ text with gradient -->
    <text x="168" y="0" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="url(#elevareGradient)">
      IQ
    </text>
  </g>
</svg>
