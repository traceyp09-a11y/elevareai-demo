version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reloading
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    environment:
      - NODE_ENV=development
      - BACKEND_URL=http://backend:3001
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - elevareiq-network

  backend:
    image: backend-backend:latest
    ports:
      - "3001:3001"
    volumes:
      - ../backend/src:/app/src
      - ../backend/database:/app/database
    environment:
      - NODE_ENV=development
      - PORT=3001
    restart: unless-stopped
    networks:
      - elevareiq-network

networks:
  elevareiq-network:
    driver: bridge
